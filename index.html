
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEON BRICK BREAKER</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;display:flex;justify-content:center;
 align-items:center;background:#080d20;color:white;
 font-family:Arial,sans-serif;
}
.game{width:min(95vw,500px);padding:18px;
 background:linear-gradient(145deg,#19244a,#090e20);
 border:1px solid #485681;border-radius:20px;
 box-shadow:0 0 40px #6455ff30}
h1{text-align:center;letter-spacing:4px;color:#aaa0ff}
.stats{display:flex;justify-content:space-around;margin:15px 0}
.stat{text-align:center;background:#ffffff10;padding:10px;
 border-radius:10px;flex:1;margin:4px}
.stat small{display:block;color:#9da9d1}
.stat strong{font-size:22px}
canvas{width:100%;height:auto;display:block;
 background:#0a1024;border-radius:12px;touch-action:none}
.controls{display:flex;gap:10px;margin-top:12px}
button{flex:1;padding:12px;border:0;border-radius:10px;
 background:#6559e9;color:white;font-weight:bold;cursor:pointer}
button:hover{background:#8b7cff}
#message{text-align:center;color:#c3baff;margin:12px 0}
</style>
</head>
<body>
<div class="game">
<h1>✦ NEON BREAKER ✦</h1>
<div class="stats">
 <div class="stat"><small>SCORE</small><strong id="score">0</strong></div>
 <div class="stat"><small>LEVEL</small><strong id="level">1</strong></div>
 <div class="stat"><small>LIFE</small><strong id="life">3</strong></div>
</div>
<canvas id="game" width="480" height="600"></canvas>
<div id="message">게임 시작 버튼을 누르세요!</div>
<div class="controls">
 <button onclick="startGame()">▶ 시작</button>
 <button onclick="togglePause()">Ⅱ 일시정지</button>
 <button onclick="resetGame()">↻ 재시작</button>
</div>
</div>
<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const W=480,H=600;
let score=0,level=1,life=3;
let running=false,paused=false,raf;
let bricks=[],particles=[];
let ball,paddle;
let keys={left:false,right:false};
let pointer=null;
const colors=["#ff598d","#ff9c52","#ffd45e",
 "#5de4bd","#53b8ff","#9e83ff"];

function createBricks(){
 bricks=[];
 let rows=Math.min(4+level,7),cols=8,gap=7;
 let bw=(W-36-(cols-1)*gap)/cols;
 for(let r=0;r<rows;r++){
  for(let c=0;c<cols;c++){
   bricks.push({
    x:18+c*(bw+gap),y:68+r*29,
    w:bw,h:19,hp:level>2&&r<2?2:1,
    color:colors[(r+c+level-1)%6],alive:true
   });
  }
 }
}

function resetBall(){
 ball={x:240,y:530,vx:3.3,vy:-4.5-(level-1)*.25,r:7};
}
function resetGame(){
 cancelAnimationFrame(raf);
 score=0;level=1;life=3;
 paddle={x:190,y:558,w:100,h:12};
 particles=[];
 createBricks();resetBall();
 running=false;paused=false;
 updateStats();draw();
 document.getElementById("message").textContent="준비 완료!";
}
function updateStats(){
 document.getElementById("score").textContent=score;
 document.getElementById("level").textContent=level;
 document.getElementById("life").textContent=life;
}
function startGame(){
 if(running)return;
 if(life<=0)resetGame();
 running=true;paused=false;
 document.getElementById("message").textContent="게임 진행 중!";
 loop();
}
function togglePause(){
 if(running){
  running=false;paused=true;
  cancelAnimationFrame(raf);
  document.getElementById("message").textContent="일시정지";
 }else if(paused)startGame();
}
function roundRect(x,y,w,h,r,color){
 ctx.fillStyle=color;
 ctx.beginPath();
 ctx.roundRect(x,y,w,h,r);
 ctx.fill();
}
function burst(x,y,color){
 for(let i=0;i<12;i++){
  let a=Math.random()*Math.PI*2;
  let s=1+Math.random()*3;
  particles.push({
   x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,
   life:1,color
  });
 }
}
function draw(){
 ctx.clearRect(0,0,W,H);
 let bg=ctx.createLinearGradient(0,0,0,H);
 bg.addColorStop(0,"#101a38");
 bg.addColorStop(1,"#090e20");
 ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

 ctx.strokeStyle="#9eafff0a";
 for(let x=0;x<W;x+=30){
  ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();
 }

 bricks.forEach(b=>{
  if(!b.alive)return;
  ctx.shadowBlur=13;ctx.shadowColor=b.color;
  roundRect(b.x,b.y,b.w,b.h,5,b.color);
  ctx.shadowBlur=0;
  roundRect(b.x+3,b.y+2,b.w-6,3,2,"#ffffff55");
  if(b.hp>1){
   ctx.fillStyle="white";ctx.font="bold 10px Arial";
   ctx.textAlign="center";
   ctx.fillText("2",b.x+b.w/2,b.y+14);
  }
 });
 particles.forEach(p=>{
  ctx.globalAlpha=p.life;
  ctx.fillStyle=p.color;
  ctx.beginPath();ctx.arc(p.x,p.y,3*p.life,0,Math.PI*2);
  ctx.fill();
 });
 ctx.globalAlpha=1;

 ctx.shadowBlur=20;ctx.shadowColor="#8d77ff";
 roundRect(paddle.x,paddle.y,paddle.w,paddle.h,7,"#c0b6ff");
 ctx.shadowBlur=0;

 ctx.shadowBlur=20;ctx.shadowColor="#69f7ff";
 let g=ctx.createRadialGradient(ball.x-2,ball.y-2,1,ball.x,ball.y,12);
 g.addColorStop(0,"white");g.addColorStop(.4,"#8fffff");
 g.addColorStop(1,"#43a7ff");
 ctx.fillStyle=g;
 ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);
 ctx.fill();ctx.shadowBlur=0;
}
function update(){
 if(keys.left)paddle.x-=7;
 if(keys.right)paddle.x+=7;
 if(pointer!==null)
  paddle.x+=(pointer-paddle.w/2-paddle.x)*.25;
 paddle.x=Math.max(0,Math.min(W-paddle.w,paddle.x));

 ball.x+=ball.vx;ball.y+=ball.vy;

 if(ball.x<ball.r||ball.x>W-ball.r){
  ball.vx*=-1;
  ball.x=Math.max(ball.r,Math.min(W-ball.r,ball.x));
 }
 if(ball.y<ball.r)ball.vy=Math.abs(ball.vy);

 if(ball.vy>0&&ball.y+ball.r>=paddle.y&&
 ball.y-ball.r<paddle.y+paddle.h&&
 ball.x>=paddle.x-3&&ball.x<=paddle.x+paddle.w+3){
  let hit=(ball.x-(paddle.x+paddle.w/2))/(paddle.w/2);
  ball.vx=hit*5.8;
  ball.vy=-Math.sqrt(Math.max(12,ball.vx**2+ball.vy**2));
  ball.y=paddle.y-ball.r;
 }

 for(let b of bricks){
  if(!b.alive)continue;
  if(ball.x+ball.r>b.x&&ball.x-ball.r<b.x+b.w&&
  ball.y+ball.r>b.y&&ball.y-ball.r<b.y+b.h){
   let ox=Math.min(ball.x+ball.r-b.x,b.x+b.w-(ball.x-ball.r));
   let oy=Math.min(ball.y+ball.r-b.y,b.y+b.h-(ball.y-ball.r));
   if(ox<oy)ball.vx*=-1;else ball.vy*=-1;
   b.hp--;burst(ball.x,ball.y,b.color);
   if(b.hp<=0){
    b.alive=false;score+=10;updateStats();
   }
   break;
  }
 }

 particles=particles.filter(p=>p.life>.05);
 particles.forEach(p=>{
  p.x+=p.vx;p.y+=p.vy;
  p.life-=.035;p.vx*=.98;p.vy*=.98;
 });

 if(ball.y>H+10){
  life--;updateStats();
  if(life<=0){
   running=false;
   document.getElementById("message").textContent=
    "GAME OVER! 최종 점수: "+score;
   return;
  }
  resetBall();
 }

 if(bricks.every(b=>!b.alive)){
  level++;createBricks();resetBall();updateStats();
 }
 draw();
}
function loop(){
 if(!running)return;
 update();
 if(running)raf=requestAnimationFrame(loop);
}
canvas.addEventListener("pointermove",e=>{
 let rect=canvas.getBoundingClientRect();
 pointer=(e.clientX-rect.left)/rect.width*W;
});
canvas.addEventListener("pointerleave",()=>pointer=null);

document.addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft"||e.key==="a")keys.left=true;
 if(e.key==="ArrowRight"||e.key==="d")keys.right=true;
 if(e.key===" "){
  e.preventDefault();
  if(!running)startGame();else togglePause();
 }
});
document.addEventListener("keyup",e=>{
 if(e.key==="ArrowLeft"||e.key==="a")keys.left=false;
 if(e.key==="ArrowRight"||e.key==="d")keys.right=false;
});
resetGame();
</script>
</body>
</html>
